<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pulse Page 2 · Action log</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@380;460;560&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#e7e1d5; --card:#fbf8f2; --ink:#1b1612; --muted:#6d645b; --line:#ddd4c6; --line-strong:#cfc4b4; --call:#8d3419; --ok:#1d5c40; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Outfit, sans-serif; font-weight: 380; }
    main { width: min(100%, 520px); margin: 0 auto; padding: 16px 16px 40px; }
    a { color: var(--call); text-decoration: none; }
    h1 { font-family: Fraunces, Palatino, serif; font-weight: 500; font-size: 30px; letter-spacing: -0.03em; margin: 6px 0 4px; }
    .kicker { letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
    .note { color: var(--muted); font-size: 14px; }
    .links { display: flex; gap: 14px; margin: 8px 0 12px; font-size: 14px; }
    .mode { display: flex; gap: 6px; margin-bottom: 8px; }
    .mode button { flex: 1; border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 8px; font: inherit; }
    .mode button.on { background: var(--ink); color: #f6f2ea; }
    .tools { display: grid; gap: 8px; }
    select, input { width: 100%; border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 10px; font: inherit; font-size: 16px; }
    .count { font-size: 13px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; }
    .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .card b { font-size: 17px; }
    .pill { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 3px 8px; background: #f6edd9; }
    .ok { color: var(--ok); font-weight: 560; }
    .bad { color: var(--call); font-weight: 560; }
    .sub { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Pulse Page 2</p>
    <h1>Action log</h1>
    <p class="note" id="lede">Day actions are judged on the next same weekday. Week actions on the next close.</p>
    <p class="links"><a href="index.html">Call list</a><a href="actions.html">Did it hold</a></p>
    <div class="mode"><button id="all" class="on">All</button><button id="day">Day</button><button id="week">Week</button></div>
    <div class="tools">
      <select id="region" aria-label="Region"><option value="">All regions</option><option>North</option><option>Central</option><option>South</option></select>
      <select id="manager" aria-label="Market manager"><option value="">All market managers</option></select>
      <select id="store" aria-label="Store"><option value="">All stores</option></select>
      <input id="q" placeholder="Search store, manager, action" />
    </div>
    <p class="count" id="count"></p>
    <div id="list"></div>
  </main>
  <script src="org.js"></script>
  <script src="actions.js"></script>
  <script src="data.js?v=metrics"></script>
  <script>
    const ORG = window.PULSE_ORG;
    const latest = window.PULSE_WEEKS[window.PULSE_WEEKS.length - 1];
    const byId = Object.fromEntries(latest.stores.map((s) => [s.id, s]));
    const managerOf = Object.fromEntries(ORG.managers.flatMap((m) => m.stores.map((id) => [id, m])));
    const phone = JSON.parse(localStorage.getItem("pulse2.z.v1.actions") || "[]").map((log) => ({
      id: log.id, week: log.when || "2029-09-09", span: log.span || "week",
      who: log.who || "This phone", role: log.role || "Entered", how: log.how || "Call",
      action: log.action, driver: log.driver, before: log.before, after: null, recovered: null
    }));
    const actions = window.PULSE_ACTIONS.concat(phone);
    document.getElementById("manager").innerHTML += ORG.managers.map((m) => `<option value="${m.id}">${m.name} (${m.region})</option>`).join("");
    document.getElementById("store").innerHTML += latest.stores.slice().sort((a, b) => a.name.localeCompare(b.name)).map((s) => `<option value="${s.id}">${s.name}</option>`).join("");
    let span = "all";
    const pct = (n) => n == null ? "—" : (n < 0 ? "−" : "+") + Math.abs(Math.round(n)) + "%";
    function when(a) {
      const d = new Date(a.week + "T12:00:00");
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }
    function result(a) {
      if (a.recovered == null) return `<span class="sub">Waiting on the next ${a.span}</span>`;
      return `<span class="${a.recovered ? "ok" : "bad"}">${a.recovered ? "Held" : "Still off"}</span><span class="sub">${pct(a.before)} → ${pct(a.after)}</span>`;
    }
    function draw() {
      const region = document.getElementById("region").value;
      const manager = document.getElementById("manager").value;
      const store = document.getElementById("store").value;
      const q = document.getElementById("q").value.trim().toLowerCase();
      const mgr = ORG.managers.find((m) => m.id === manager);
      const list = actions.filter((a) => {
        const s = byId[a.id] || {};
        if (span !== "all" && a.span !== span) return false;
        if (region && s.region !== region) return false;
        if (mgr && !mgr.stores.includes(a.id)) return false;
        if (store && a.id !== store) return false;
        if (!q) return true;
        return [s.name, a.who, a.action, a.how].join(" ").toLowerCase().includes(q);
      }).sort((a, b) => a.week < b.week ? 1 : -1);
      document.getElementById("count").textContent = list.length + " actions";
      document.getElementById("list").innerHTML = list.map((a) => {
        const s = byId[a.id] || {};
        const mm = managerOf[a.id];
        return `<article class="card">
          <div class="top"><b>${s.name || a.id}</b><span class="pill">${a.span}</span></div>
          <span class="sub">${when(a)} · ${s.region || ""} · ${mm ? mm.name : ""}</span>
          <p>${a.how} · ${a.action}</p>
          <span class="sub">${a.who} · ${a.role}</span>
          ${result(a)}
        </article>`;
      }).join("") || `<p class="note">Nothing in this view.</p>`;
    }
    document.querySelectorAll(".mode button").forEach((b) => b.onclick = () => {
      span = b.id;
      document.querySelectorAll(".mode button").forEach((x) => x.classList.toggle("on", x === b));
      draw();
    });
    ["region", "manager", "store", "q"].forEach((id) => document.getElementById(id).oninput = draw);
    draw();
  </script>
</body>
</html>
