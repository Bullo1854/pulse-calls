<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pulse Page 2 · Action log</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@380;460;560&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#e7e1d5; --sheet:#f6f2ea; --card:#fbf8f2; --ink:#1b1612; --muted:#6d645b; --line:#ddd4c6; --line-strong:#cfc4b4; --call:#8d3419; --ok:#1d5c40; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Outfit, sans-serif; font-weight: 380; }
    main { width: min(100%, 980px); margin: 0 auto; padding: 20px 16px 48px; }
    a { color: var(--call); }
    h1 { font-family: Fraunces, Palatino, serif; font-weight: 500; font-size: 32px; letter-spacing: -0.03em; margin: 8px 0 4px; }
    .kicker { letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
    .note { color: var(--muted); font-size: 14px; }
    .tools { display: grid; gap: 8px; margin: 14px 0; }
    input, select { width: 100%; border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 10px; font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (min-width: 800px) { .row { grid-template-columns: 1fr 1.4fr 1fr 1fr; } }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
    th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); cursor: pointer; background: var(--sheet); }
    th.on { color: var(--call); }
    .who { font-weight: 560; }
    .sub { display: block; color: var(--muted); font-size: 12px; }
    .ok { color: var(--ok); font-weight: 560; }
    .bad { color: var(--call); font-weight: 560; }
    .empty { padding: 18px; color: var(--muted); }
    .count { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
    .links a { margin-right: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Pulse Page 2</p>
    <h1>Action log</h1>
    <p class="note" id="lede">Pick a market manager or a region. The result is the next week, after weather.</p>
    <p class="links"><a href="index.html">Call list</a><a href="actions.html">Did the coaching hold</a><a href="notes.html">Definitions</a></p>
    <div class="tools">
      <div class="row">
        <select id="region" aria-label="Region"><option value="">All regions</option><option>North</option><option>Central</option><option>South</option></select>
        <select id="manager" aria-label="Market manager"><option value="">All market managers</option></select>
        <select id="store"><option value="">All stores</option></select>
        <select id="status"><option value="">All statuses</option><option value="recovered">Back on pace</option><option value="missed">Still off</option><option value="open">Waiting on next close</option></select>
      </div>
      <input id="q" placeholder="Search store, manager, action" />
    </div>
    <p class="count" id="count"></p>
    <div id="table"></div>
  </main>
  <script src="org.js"></script>
  <script src="actions.js"></script>
  <script src="data.js?v=metrics"></script>
  <script>
    const ORG = window.PULSE_ORG;
    const weeks = window.PULSE_WEEKS;
    const latest = weeks[weeks.length - 1];
    const byId = Object.fromEntries(latest.stores.map((s) => [s.id, s]));
    const managerOf = Object.fromEntries(ORG.managers.flatMap((m) => m.stores.map((id) => [id, m])));
    const saved = JSON.parse(localStorage.getItem("pulse2.z.v1.logs") || "{}");
    const phone = Object.entries(saved).map(([id, log]) => ({
      id, week: "2029-09-09", who: log.who || "This phone", role: log.role || "Entered",
      how: log.how || "Call", action: log.action, driver: log.driver || (byId[id] || {}).driver,
      before: byId[id] ? byId[id].adj_pct : null, after: null, recovered: null, source: "phone"
    }));
    const actions = window.PULSE_ACTIONS.concat(phone);
    document.getElementById("manager").innerHTML += ORG.managers.map((m) => `<option value="${m.id}">${m.name} (${m.region})</option>`).join("");
    document.getElementById("store").innerHTML += latest.stores.slice().sort((a, b) => a.name.localeCompare(b.name)).map((s) => `<option value="${s.id}">${s.name}</option>`).join("");
    ["region", "manager"].forEach((id) => { const v = localStorage.getItem("pulse2.z.v1." + id); if (v) document.getElementById(id).value = v; });
    const pct = (n) => n == null ? "—" : (n < 0 ? "−" : "+") + Math.abs(n).toFixed(0) + "%";
    function weekLabel(asOf) {
      const end = new Date(asOf + "T12:00:00");
      const start = new Date(end); start.setDate(end.getDate() - 6);
      const left = start.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      return (start.getMonth() === end.getMonth() ? left + " – " + end.getDate() : left + " – " + end.toLocaleDateString("en-US", { month: "short", day: "numeric" })) + ", " + end.getFullYear();
    }
    function resultText(a) {
      if (a.recovered == null) return `<span class="sub">Waiting on the next close</span>`;
      const change = a.after - a.before;
      return `<span class="${a.recovered ? "ok" : "bad"}">${a.recovered ? "Back on pace" : "Still off"}</span><span class="sub">${pct(a.before)} then ${pct(a.after)} · ${change >= 0 ? "+" : "−"}${Math.abs(change).toFixed(0)} pts</span>`;
    }
    let sortKey = "week", sortDir = -1;
    function rows() {
      const region = document.getElementById("region").value;
      const manager = document.getElementById("manager").value;
      const store = document.getElementById("store").value;
      const status = document.getElementById("status").value;
      const q = document.getElementById("q").value.trim().toLowerCase();
      const mgr = ORG.managers.find((m) => m.id === manager);
      return actions.filter((a) => {
        const s = byId[a.id] || {};
        if (region && s.region !== region) return false;
        if (mgr && !mgr.stores.includes(a.id)) return false;
        if (store && a.id !== store) return false;
        if (status === "recovered" && a.recovered !== true) return false;
        if (status === "missed" && a.recovered !== false) return false;
        if (status === "open" && a.recovered != null) return false;
        if (!q) return true;
        return [s.name, a.who, a.action, a.driver, a.how].join(" ").toLowerCase().includes(q);
      }).sort((a, b) => {
        const av = sortKey === "store" ? (byId[a.id] || {}).name : a[sortKey];
        const bv = sortKey === "store" ? (byId[b.id] || {}).name : b[sortKey];
        if (typeof av === "number" || typeof bv === "number") return ((av || 0) - (bv || 0)) * sortDir;
        return String(av || "").localeCompare(String(bv || "")) * sortDir;
      });
    }
    function draw() {
      const region = document.getElementById("region").value;
      const manager = document.getElementById("manager").value;
      localStorage.setItem("pulse2.z.v1.region", region);
      localStorage.setItem("pulse2.z.v1.manager", manager);
      const list = rows();
      const mgr = ORG.managers.find((m) => m.id === manager);
      const leader = ORG.regions.find((r) => r.id === region);
      document.getElementById("lede").textContent = mgr
        ? mgr.name + " · " + mgr.patch + " (" + mgr.region + "). " + mgr.stores.length + " stores. Result is the next week after weather."
        : leader ? leader.id + " · " + leader.leader + ", regional leader. Result is the next week after weather."
        : "All regions. Elena Voss has the North, Marcus Hale the Central, Priya Nand the South.";
      document.getElementById("count").textContent = list.length + " actions";
      const heads = [["week", "Week"], ["store", "Store"], ["who", "Entered by"], ["action", "Action"], ["after", "Result"]];
      const head = heads.map(([k, label]) => `<th data-sort="${k}" class="${sortKey === k ? "on" : ""}">${label}</th>`).join("");
      const body = list.length ? list.map((a) => {
        const s = byId[a.id] || {};
        const mm = managerOf[a.id];
        return `<tr>
          <td>${weekLabel(a.week)}<span class="sub">${a.how}</span></td>
          <td>${s.name || a.id}<span class="sub">${s.region || ""} · ${mm ? mm.name : ""}</span></td>
          <td><span class="who">${a.who}</span><span class="sub">${a.role}</span></td>
          <td>${a.action}<span class="sub">${a.driver} · product mix is weekly, not daily</span></td>
          <td>${resultText(a)}</td>
        </tr>`;
      }).join("") : `<tr><td class="empty" colspan="5">Nothing in this patch.</td></tr>`;
      document.getElementById("table").innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      document.querySelectorAll("[data-sort]").forEach((th) => th.onclick = () => {
        sortDir = sortKey === th.dataset.sort ? -sortDir : th.dataset.sort === "week" ? -1 : 1;
        sortKey = th.dataset.sort;
        draw();
      });
    }
    document.getElementById("region").onchange = () => {
      const region = document.getElementById("region").value;
      const mgr = document.getElementById("manager");
      mgr.innerHTML = `<option value="">All market managers</option>` + ORG.managers.filter((m) => !region || m.region === region).map((m) => `<option value="${m.id}">${m.name} (${m.region})</option>`).join("");
      draw();
    };
    ["manager", "store", "status", "q"].forEach((id) => document.getElementById(id).oninput = draw);
    draw();
  </script>
</body>
</html>
