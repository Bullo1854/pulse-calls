<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1612" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pulse · Calls</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@380;460;560&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #e7e1d5; --sheet: #f6f2ea; --card: #fbf8f2; --ink: #1b1612;
      --muted: #6d645b; --faint: #8d847a; --line: #ddd4c6; --line-strong: #cfc4b4;
      --call: #8d3419; --ok: #1d5c40; --watch: #8a5a16; --sand: #e4d8c8;
      --serif: Fraunces, Palatino, serif; --sans: Outfit, "Avenir Next", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 380; line-height: 1.35; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .phone { width: min(100%, 480px); margin: 0 auto; min-height: 100dvh; background: var(--paper); }
    .app { padding: calc(16px + env(safe-area-inset-top)) 16px 36px; }
    header.top { display: flex; justify-content: space-between; align-items: flex-start; }
    .mark b { letter-spacing: 0.16em; font-size: 12px; font-weight: 560; }
    .mark span { display: block; font-family: var(--serif); font-size: 22px; }
    .pill { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 999px; padding: 4px 9px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--watch); }
    .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--watch); }
    .fresh { text-align: right; }
    .fresh small { display: block; margin-top: 6px; color: var(--muted); }
    .scope { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; text-align: left; }
    .scope .who { font-weight: 560; }
    .scope .sub { display: block; color: var(--muted); font-size: 12px; }
    .scope .chg { color: var(--call); letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; }
    .navline { display: flex; gap: 14px; margin: 10px 0 0; font-size: 14px; }
    .navline a { color: var(--call); text-decoration: none; font-weight: 560; }
    h1 { font-family: var(--serif); font-weight: 500; font-size: 30px; letter-spacing: -0.03em; margin: 14px 0 4px; }
    .lede { margin: 0; font-size: 14.5px; }
    .zrow { margin: 12px 0 4px; }
    .zrow svg { width: 100%; height: 78px; display: block; }
    .legend { display: flex; gap: 12px; color: var(--faint); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .card, .slim { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; }
    .card .topr, .slim { display: flex; justify-content: space-between; gap: 8px; }
    .z { font-family: var(--serif); font-size: 28px; color: var(--call); letter-spacing: -0.03em; }
    .z small { font-family: var(--sans); font-size: 11px; color: var(--faint); letter-spacing: 0.08em; display: block; }
    h2 { margin: 2px 0 0; font-size: 18px; font-weight: 560; }
    .meta, .note { color: var(--muted); font-size: 12.5px; }
    .title { font-family: var(--serif); font-size: 17px; margin: 6px 0 0; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); background: var(--sheet); }
    .chip.daily { color: var(--watch); background: #f6edd9; border-color: #e4d3b0; }
    .chip.wx { color: #31556a; background: #e7f0f4; border-color: #c9dde6; }
    h3.sec { margin: 18px 0 4px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
    .slim { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 9px 0; margin: 0; }
    .slim b { font-weight: 560; }
    .slim span { display: block; color: var(--muted); font-size: 12px; }
    .slim em { font-style: normal; font-family: var(--serif); color: var(--watch); }
    .slim.ok em { color: var(--ok); }
    .learn { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 14px; }
    .barline { display: grid; grid-template-columns: 78px 1fr 52px; gap: 8px; align-items: center; font-size: 12.5px; margin-top: 6px; }
    .track { height: 8px; background: #efe7dc; border-radius: 99px; overflow: hidden; }
    .track b { display: block; height: 100%; background: var(--ok); }
    .tie { color: var(--muted); font-size: 12px; }
    .textbtn { background: none; border: 0; padding: 0; color: var(--call); }
    .sheet-back { position: fixed; inset: 0; background: rgba(28,22,16,.4); display: none; z-index: 20; }
    .sheet-back.open { display: block; }
    .sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(480px, 100%); max-height: 88dvh; overflow: auto; background: var(--sheet); border-radius: 20px 20px 0 0; z-index: 21; padding: 12px 16px 28px; display: none; }
    .sheet.open { display: block; }
    .sheet h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; }
    .try { margin: 8px 0; padding-left: 18px; }
    .try li { margin: 4px 0; }
    label { display: block; font-size: 12px; color: var(--muted); margin-top: 10px; }
    select, textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 8px; font: inherit; }
    .acts { display: flex; gap: 8px; margin-top: 12px; }
    .acts button { flex: 1; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); padding: 10px; }
    .acts .primary { background: var(--ink); color: var(--sheet); }
    .close-x { float: right; border: 0; background: none; color: var(--muted); }
    .scopes button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; display: flex; justify-content: space-between; }
    .scopes button.on { color: var(--call); font-weight: 560; }
    .logged { color: var(--ok); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 560; }
  </style>
</head>
<body>
  <main class="phone"><div class="app" id="app"></div></main>
  <div class="sheet-back" id="back"></div>
  <section class="sheet" id="sheet"></section>
  <script src="data.js"></script>
  <script>
    const D = window.PULSE2;
    const byId = Object.fromEntries(D.stores.map((s) => [s.id, s]));
    const KEY = "pulse2.z.v1";
    const state = {
      scope: localStorage.getItem(KEY + ".scope") || "company",
      logs: JSON.parse(localStorage.getItem(KEY + ".logs") || "{}"),
      reviews: JSON.parse(localStorage.getItem(KEY + ".reviews") || "{}"),
    };
    const save = () => {
      localStorage.setItem(KEY + ".scope", state.scope);
      localStorage.setItem(KEY + ".logs", JSON.stringify(state.logs));
      localStorage.setItem(KEY + ".reviews", JSON.stringify(state.reviews));
    };
    const inScope = (s) => state.scope === "company" || (state.scope.startsWith("region:") && s.region === state.scope.slice(7)) || (state.scope.startsWith("market:") && s.market === state.scope.slice(7));
    const scopeLabel = () => state.scope === "company" ? "Company" : state.scope.split(":")[1];
    const money = (n) => {
      if (n == null) return "—";
      const sign = n < 0 ? "−" : n > 0 ? "+" : "";
      const a = Math.abs(n);
      return a >= 1000 ? sign + "$" + (a / 1000).toFixed(1) + "k" : sign + "$" + Math.round(a);
    };
    const pct = (n) => (n < 0 ? "−" : "+") + Math.abs(n).toFixed(0) + "%";

    function rateFor(driver) {
      const stat = D.learning.by_driver.find((d) => d.driver === driver) || { n: 0, recovered: 0, rate: null };
      const extra = Object.values(state.reviews).filter((r) => r.driver === driver);
      const n = stat.n + extra.length;
      const recovered = stat.recovered + extra.filter((r) => r.recovered).length;
      return { n, recovered, rate: n ? recovered / n : null, base: stat };
    }

    function weekSvg(s) {
      const max = Math.max(...s.days.map((d) => Math.max(Math.abs(d.net), d.exp)), 1);
      return `<svg viewBox="0 0 280 46" width="100%" height="46" aria-label="Seven days against own pace">
        ${s.days.map((d, i) => {
          const x = i * 40;
          const eh = Math.max(2, d.exp / max * 32);
          const ah = Math.max(2, Math.abs(d.net) / max * 32);
          const beat = d.net >= d.exp * 0.97;
          return `<rect x="${x + 6}" y="${36 - eh}" width="8" height="${eh}" rx="1.5" fill="#e4d8c8"/>
                  <rect x="${x + 18}" y="${d.net < 0 ? 36 : 36 - ah}" width="8" height="${ah}" rx="1.5" fill="${beat ? "#1d5c40" : "#8d3419"}"/>
                  <text x="${x + 16}" y="45" font-size="8" fill="#8d847a" text-anchor="middle">${d.wd[0]}</text>`;
        }).join("")}
      </svg>`;
    }

    function dotPlot(list) {
      const min = -70, max = 50;
      const x = (p) => 16 + (Math.max(min, Math.min(max, p)) - min) / (max - min) * 300;
      const dots = list.map((s) => {
        const call = D.call_ids.includes(s.id);
        const watch = D.watch_ids.includes(s.id);
        const color = call ? "#8d3419" : watch ? "#8a5a16" : "#1d5c40";
        return `<circle cx="${x(s.adj_pct)}" cy="28" r="${call ? 6 : 4}" fill="${color}"><title>${s.name} ${s.adj_pct}%</title></circle>`;
      }).join("");
      return `<svg viewBox="0 0 332 52" role="img" aria-label="Percent off pace after weather">
        <line x1="16" y1="28" x2="316" y2="28" stroke="#cfc4b4"/>
        <line x1="${x(-30)}" y1="16" x2="${x(-30)}" y2="40" stroke="#8d3419" stroke-dasharray="2 2"/>
        <line x1="${x(0)}" y1="18" x2="${x(0)}" y2="38" stroke="#8d847a"/>
        ${dots}
        <text x="16" y="50" font-size="9" fill="#8d847a">−70%</text>
        <text x="292" y="50" font-size="9" fill="#8d847a">+50%</text>
      </svg>`;
    }

    function render() {
      const calls = D.call_ids.map((id) => byId[id]).filter(inScope);
      const watches = D.watch_ids.map((id) => byId[id]).filter(inScope);
      const quiet = D.quiet_ids.map((id) => byId[id]).filter(inScope);
      const scoped = D.stores.filter(inScope);
      document.getElementById("app").innerHTML = `
        <header class="top">
          <div class="mark"><b>PULSE</b><span>Calls</span></div>
          <div class="fresh"><div class="pill"><i></i> ${D.freshness}</div><small>${D.as_of_label}</small></div>
        </header>
        <p class="navline"><a href="log.html">Action log</a><a href="notes.html">Definitions</a></p>
        <button class="scope" id="open-scope"><span><span class="who">${scopeLabel()}</span><span class="sub">${scoped.length} stores · dollars and percent off pace</span></span><span class="chg">Scope</span></button>
        <h1>Who is off pace?</h1>
        <p class="lede">${calls.length} call${calls.length === 1 ? "" : "s"}. A typical store was ${pct(D.company_week.peer_median)} versus its own pace, after weather. The mark on the plot is about 30% off — far enough to call.</p>
        <div class="zrow">${dotPlot(scoped)}</div>
        <div class="legend"><span><i class="sw" style="background:#8d3419"></i>Call</span><span><i class="sw" style="background:#8a5a16"></i>Watch</span><span><i class="sw" style="background:#1d5c40"></i>On pace</span></div>
        ${calls.map(card).join("")}
        ${watches.length ? `<h3 class="sec">Watch — coach if you are already on the phone</h3>` + watches.map(slim).join("") : ""}
        ${quiet.length ? `<h3 class="sec">Leave alone</h3>` + quiet.slice(0, 2).map((s) => `<button class="slim ok" data-open="${s.id}"><span><b>${s.name}</b><span>${s.climate} · ${pct(s.adj_pct)} after weather</span></span><em>${money(s.adj_gap)}</em></button>`).join("") : ""}
        ${learnBlock()}
        <p class="tie">Week net <b>${D.company_week.net.toLocaleString("en-US", { style: "currency", currency: "USD" })}</b> · ${D.company_week.rows} rows. Ties to net sales. Weather is simulated for the climate. <a class="textbtn" href="notes.html">Definitions</a></p>`;
      document.getElementById("open-scope").onclick = () => openSheet(scopeSheet());
      document.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openSheet(evidence(b.dataset.open)));
      const m = document.getElementById("open-method");
      if (m) m.onclick = () => openSheet(methodSheet());
    }

    function card(s) {
      const log = state.logs[s.id];
      return `<button class="card" data-open="${s.id}">
        <div class="topr"><span class="z">${pct(s.adj_pct)}<small>vs own pace</small></span><span class="meta">${money(s.adj_gap)} after weather<br>${money(s.raw_gap)} before weather</span></div>
        <h2>${s.name}</h2>
        <div class="meta">${s.format} · ${s.market} · ${s.climate}</div>
        <p class="title">${s.title}</p>
        ${weekSvg(s)}
        <div class="chips"><span class="chip daily">Daily</span><span class="chip wx">${s.wx.inches} in vs ${s.wx.ly_inches} in last year</span>${log ? `<span class="logged">Logged · ${log.role || "entered"}</span>` : ""}</div>
        <p class="note">${s.say}</p>
      </button>`;
    }
    function slim(s) {
      return `<button class="slim" data-open="${s.id}"><span><b>${s.name}</b><span>${s.title} · ${pct(s.adj_pct)}</span></span><em>${money(s.adj_gap)}</em></button>`;
    }

    function learnBlock() {
      const rows = D.learning.by_driver.map((d) => {
        const r = rateFor(d.driver);
        return `<div class="barline"><span>${d.driver}</span><div class="track"><b style="width:${(r.rate || 0) * 100}%"></b></div><span>${r.recovered}/${r.n}</span></div>`;
      }).join("");
      const reviewed = Object.keys(state.reviews).length;
      return `<section class="learn">
        <h3 class="sec" style="margin-top:0">Did the coaching hold</h3>
        <p class="note">${D.learning.note}</p>
        ${rows}
        <p class="note">${reviewed ? reviewed + " review tags on this phone are in the rates above." : "Tag a past flag in a store sheet and the rate moves."}</p>
        <button class="textbtn" id="open-method">How the flag is earned</button>
      </section>`;
    }

    function wxSvg(s) {
      const days = s.days;
      const max = Math.max(0.4, ...days.map((d) => Math.max(d.wx.inches, d.ly.inches)));
      return `<svg viewBox="0 0 280 64" width="100%" height="64" aria-label="Rain this week versus last year">
        ${days.map((d, i) => {
          const x = i * 40;
          const h1 = d.wx.inches / max * 36;
          const h2 = d.ly.inches / max * 36;
          return `<rect x="${x + 6}" y="${40 - h1}" width="8" height="${Math.max(h1, 1)}" fill="#31556a"/>
                  <rect x="${x + 18}" y="${40 - h2}" width="8" height="${Math.max(h2, 1)}" fill="#c9dde6"/>
                  <text x="${x + 16}" y="54" font-size="8" fill="#8d847a" text-anchor="middle">${d.wd}</text>`;
        }).join("")}
        <text x="0" y="62" font-size="8" fill="#31556a">This week</text>
        <text x="70" y="62" font-size="8" fill="#8aa4b0">Last year</text>
      </svg>`;
    }

    function evidence(id) {
      const s = byId[id];
      const log = state.logs[id];
      const est = rateFor(s.driver);
      const past = D.learning.weeks.flatMap((w) => w.items.filter((it) => it.id === id).map((it) => ({ ...it, label: w.label })));
      const pastHtml = past.length ? past.map((it) => {
        const key = id + "|" + it.label;
        const tagged = state.reviews[key];
        return `<p class="note">${it.label}: ${it.adj_pct}% off pace, next week ${it.next_pct}% after weather, ${it.recovered ? "back on pace" : "still off"}. Rain ${it.wx_inches} in, next week ${it.next_wx} in.
          <button class="textbtn" data-review="${key}" data-driver="${s.driver}" data-rec="${it.recovered}">${tagged ? "Tagged" : "Tag this coaching"}</button></p>`;
      }).join("") : `<p class="note">No earlier flag for this store in the review window. The estimate uses other stores with the same driver.</p>`;
      return `
        <button class="close-x" data-close>Close</button>
        <p class="meta">${s.zone} · ${s.climate}</p>
        <h2>${s.name}</h2>
        <p class="title">${s.title} · ${pct(s.adj_pct)} and ${money(s.adj_gap)} after weather</p>
        <p>${s.why}</p>
        <p class="note">An inch of snow costs about ${s.snow_hit}% of a day here, versus about 6% on the New England coast and about 40% in Georgia. An inch of rain costs about ${s.rain_hit}%. Florida is used to a storm. Georgia is not used to snow.</p>
        <p><strong>Say this:</strong> ${s.say}</p>
        <ol class="try">${s.try.map((t) => `<li>${t}</li>`).join("")}</ol>
        <label>Entered by</label>
        <input id="who" placeholder="Name" value="${log ? log.who : ""}" style="width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:8px;font:inherit" />
        <label>Role</label>
        <select id="role">
          <option ${log && log.role === "Regional manager" ? "selected" : ""}>Regional manager</option>
          <option ${log && log.role === "Executive" ? "selected" : ""}>Executive</option>
        </select>
        <label>Corrective action</label>
        <select id="act">${s.try.map((t) => `<option>${t}</option>`).join("")}<option>Other — note below</option></select>
        <label>Note for the file</label>
        <textarea id="note" rows="2" placeholder="What you told the manager">${log ? log.note : ""}</textarea>
        <div class="acts">
          <button class="primary" id="save-log" data-id="${id}">${log ? "Update log" : "Log action"}</button>
        </div>
        ${log ? `<p class="note">Logged ${log.at.slice(0, 10)} by ${log.who || "unknown"}, ${log.role || "role not set"}: ${log.action}</p>` : `<p class="note">The log records who entered it. It stays on this phone.</p>`}
        <p class="note">Sand bars are own pace. Ink is this week. Below, rain versus the comparable days last year. Simulated for ${s.climate}, not a forecast feed.</p>
        ${weekSvg(s)}
        ${wxSvg(s)}
        <p class="note">Weather explained ${Math.round(s.wx_share * 100)}% of the raw miss. Adjusted gap ${money(s.adj_gap)} (${pct(s.adj_pct)}). Raw gap ${money(s.raw_gap)}.</p>
        <p><strong>If you coach ${s.driver}:</strong> ${est.recovered} of ${est.n} similar flags were back inside the pack the next week, after weather. ${est.rate == null ? "" : Math.round(est.rate * 100) + "%."}</p>
        ${pastHtml}`;
    }

    function scopeSheet() {
      const regions = D.regions.map((r) => `
        <button data-scope="region:${r.name}" class="${state.scope === "region:" + r.name ? "on" : ""}"><span>${r.name}</span><span>${r.zone}</span></button>
        ${r.markets.map((m) => `<button data-scope="market:${m.name}" class="${state.scope === "market:" + m.name ? "on" : ""}"><span>${m.name}</span><span>${m.climate}</span></button>`).join("")}
      `).join("");
      return `<button class="close-x" data-close>Close</button><h2>Scope</h2><p class="note">North is the Northeast. Central is the central East Coast. South is Florida, Georgia, Alabama. Weather is simulated for that climate.</p><div class="scopes"><button data-scope="company" class="${state.scope === "company" ? "on" : ""}"><span>Company</span><span>23</span></button>${regions}</div>`;
    }
    function methodSheet() {
      return `<button class="close-x" data-close>Close</button><h2>How a flag is earned</h2><p>${D.method}</p><p>Own pace is the same weekday over the prior 8 weeks. Weather then moves that pace. An inch of snow is a small hit on the New England coast, about 6% of the day, and a shutdown in Georgia, about 40%. Florida treats an inch of rain as a normal storm, about 5%. The same inch in New England costs about 10%.</p><p>The screen shows the dollar hole and the percent off pace. A store is a call when that percent is far below both its own habit and the typical store, after weather.</p><p>Logging an action stores it on this phone. Tagging a past flag folds that result into the rate for that kind of problem.</p><p><button class="textbtn" id="reset">Reset this phone</button></p>`;
    }

    function openSheet(html) {
      const sheet = document.getElementById("sheet");
      sheet.innerHTML = html;
      sheet.classList.add("open");
      document.getElementById("back").classList.add("open");
      sheet.querySelectorAll("[data-close]").forEach((b) => b.onclick = closeSheet);
      sheet.querySelectorAll("[data-scope]").forEach((b) => b.onclick = () => { state.scope = b.dataset.scope; save(); closeSheet(); render(); });
      sheet.querySelectorAll("[data-review]").forEach((b) => b.onclick = () => {
        state.reviews[b.dataset.review] = { driver: b.dataset.driver, recovered: b.dataset.rec === "true" };
        save(); openSheet(evidence(b.dataset.review.split("|")[0]));
      });
      const saveBtn = document.getElementById("save-log");
      if (saveBtn) saveBtn.onclick = () => {
        const id = saveBtn.dataset.id;
        const who = document.getElementById("who").value.trim();
        if (!who) { document.getElementById("who").focus(); return; }
        state.logs[id] = {
          action: document.getElementById("act").value,
          note: document.getElementById("note").value,
          who,
          role: document.getElementById("role").value,
          at: new Date().toISOString(),
          driver: byId[id].driver
        };
        save(); closeSheet(); render();
      };
      const reset = document.getElementById("reset");
      if (reset) reset.onclick = () => { state.logs = {}; state.reviews = {}; save(); closeSheet(); render(); };
    }
    function closeSheet() {
      document.getElementById("sheet").classList.remove("open");
      document.getElementById("back").classList.remove("open");
    }
    document.getElementById("back").onclick = closeSheet;
    render();
    const openId = (location.hash || "").replace("#", "").replace("-log", "");
    if (byId[openId]) {
      openSheet(evidence(openId));
      if (location.hash.endsWith("-log")) {
        setTimeout(() => {
          const sheet = document.getElementById("sheet");
