<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1612" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pulse Page 2 · Calls and visits</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@380;460;560&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #e7e1d5; --sheet: #f6f2ea; --card: #fbf8f2; --ink: #1b1612;
      --muted: #6d645b; --faint: #8d847a; --line: #ddd4c6; --line-strong: #cfc4b4;
      --call: #8d3419; --ok: #1d5c40; --watch: #8a5a16; --sand: #e4d8c8;
      --serif: Fraunces, Palatino, serif; --sans: Outfit, "Avenir Next", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 380; line-height: 1.35; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .phone { width: min(100%, 480px); margin: 0 auto; min-height: 100dvh; background: var(--paper); }
    .app { padding: calc(16px + env(safe-area-inset-top)) 16px 36px; }
    header.top { display: flex; justify-content: space-between; align-items: flex-start; }
    .mark b { letter-spacing: 0.16em; font-size: 12px; font-weight: 560; }
    .mark span { display: block; font-family: var(--serif); font-size: 22px; }
    .pill { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 999px; padding: 4px 9px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--watch); }
    .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--watch); }
    .fresh { text-align: right; }
    .fresh small { display: block; margin-top: 6px; color: var(--muted); }
    .scope { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; text-align: left; }
    .scope .who { font-weight: 560; }
    .scope .sub { display: block; color: var(--muted); font-size: 12px; }
    .scope .chg { color: var(--call); letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; }
    .navline { display: flex; gap: 14px; margin: 10px 0 0; font-size: 14px; }
    .mode { display: flex; gap: 6px; margin: 10px 0 0; }
    .mode button { flex: 1; border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 8px; font: inherit; }
    .mode button.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
    .readout { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
    .readout .slim { padding: 4px 0; }
    .readout .slim b { font-size: 14px; }
    .readout .slim > span span { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hot { color: var(--call); font-weight: 560; }
    .tipbox { min-height: 2.6em; font-size: 13px; margin: 6px 0 0; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 0; }
    .filters select, .storefilter { width: 100%; border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 10px; font: inherit; font-size: 14px; }
    .storefilter { margin-top: 8px; }
    .weekbar { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; margin: 12px 0 0; }
    .weekbar button { height: 48px; border: 1px solid var(--line-strong); background: var(--card); border-radius: 12px; font-size: 22px; color: var(--ink); }
    .weekbar button:disabled { opacity: 0.35; }
    .weeknow { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
    .weeknow b { display: block; font-size: 16px; font-weight: 560; }
    .note.easter { background: #f3ead2; border: 1px solid #e0d3ae; border-radius: 12px; padding: 10px 12px; color: var(--ink); }
    h1 { font-family: var(--serif); font-weight: 500; font-size: 30px; letter-spacing: -0.03em; margin: 14px 0 4px; }
    .lede { margin: 0; font-size: 14.5px; }
    .zrow { margin: 12px 0 4px; }
    .zrow svg { width: 100%; height: 78px; display: block; }
    .legend { display: flex; gap: 12px; color: var(--faint); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .card, .slim { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; }
    .card .topr, .slim { display: flex; justify-content: space-between; gap: 8px; }
    .z { font-family: var(--serif); font-size: 28px; color: var(--call); letter-spacing: -0.03em; }
    .z small { font-family: var(--sans); font-size: 11px; color: var(--faint); letter-spacing: 0.08em; display: block; }
    h2 { margin: 2px 0 0; font-size: 18px; font-weight: 560; }
    .meta, .note { color: var(--muted); font-size: 12.5px; }
    .title { font-family: var(--serif); font-size: 17px; margin: 6px 0 0; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); background: var(--sheet); }
    .chip.daily { color: var(--watch); background: #f6edd9; border-color: #e4d3b0; }
    .chip.wx { color: #31556a; background: #e7f0f4; border-color: #c9dde6; }
    h3.sec { margin: 18px 0 4px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
    .slim { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 9px 0; margin: 0; }
    .slim > span { flex: 1; min-width: 0; }
    .slim b { font-weight: 560; }
    .slim > span span { display: block; color: var(--muted); font-size: 12px; }
    .slim em { flex: none; white-space: nowrap; font-style: normal; font-family: var(--serif); color: var(--watch); }
    .slim.ok em { color: var(--ok); }
    .mcards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .mcard { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; }
    .mcard b { display: block; font-size: 13px; }
    .mcard span { color: var(--muted); font-size: 12px; }
    .mcard.bad b { color: var(--call); }
    .mcard.good b { color: var(--ok); }
    .mcard.wide { grid-column: 1 / -1; }
    .learn { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 14px; }
    .barline { display: grid; grid-template-columns: 78px 1fr 52px; gap: 8px; align-items: center; font-size: 12.5px; margin-top: 6px; }
    .track { height: 8px; background: #efe7dc; border-radius: 99px; overflow: hidden; }
    .track b { display: block; height: 100%; background: var(--ok); }
    .tie { color: var(--muted); font-size: 12px; }
    .textbtn { background: none; border: 0; padding: 0; color: var(--call); }
    .sheet-back { position: fixed; inset: 0; background: rgba(28,22,16,.4); display: none; z-index: 20; }
    .sheet-back.open { display: block; }
    .sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(480px, 100%); max-height: 88dvh; overflow: auto; background: var(--sheet); border-radius: 20px 20px 0 0; z-index: 21; padding: 12px 16px 28px; display: none; }
    .sheet.open { display: block; }
    .sheet h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; }
    .try { margin: 8px 0; padding-left: 18px; }
    .try li { margin: 4px 0; }
    label { display: block; font-size: 12px; color: var(--muted); margin-top: 10px; }
    select, textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 8px; font: inherit; }
    .acts { display: flex; gap: 8px; margin-top: 12px; }
    .acts button { flex: 1; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); padding: 10px; }
    .acts .primary { background: var(--ink); color: var(--sheet); }
    .close-x { float: right; border: 0; background: none; color: var(--muted); }
    .scopes button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; display: flex; justify-content: space-between; }
    .scopes button.on { color: var(--call); font-weight: 560; }
    .logged { color: var(--ok); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 560; }
  </style>
</head>
<body>
  <main class="phone"><div class="app" id="app"></div></main>
  <div class="sheet-back" id="back"></div>
  <section class="sheet" id="sheet"></section>
  <script src="org.js"></script>
  <script src="data.js?v=metrics"></script>
  <script src="product.js"></script>
  <script>
    const weeks = window.PULSE_WEEKS || [window.PULSE2];
    let D = weeks.find((w) => w.as_of === localStorage.getItem("pulse2.z.v1.week")) || weeks[weeks.length - 1];
    let byId = Object.fromEntries(D.stores.map((s) => [s.id, s]));
    const KEY = "pulse2.z.v1";
    const state = {
      scope: localStorage.getItem(KEY + ".scope") || "company",
      region: localStorage.getItem(KEY + ".region") || "",
      manager: localStorage.getItem(KEY + ".manager") || "",
      store: localStorage.getItem(KEY + ".store") || "",
      mode: localStorage.getItem(KEY + ".mode") || "day",
      day: localStorage.getItem(KEY + ".day") || "",
      logs: JSON.parse(localStorage.getItem(KEY + ".logs") || "{}"),
      reviews: JSON.parse(localStorage.getItem(KEY + ".reviews") || "{}"),
    };
    const save = () => {
      localStorage.setItem(KEY + ".scope", state.scope);
      localStorage.setItem(KEY + ".region", state.region);
      localStorage.setItem(KEY + ".manager", state.manager);
      localStorage.setItem(KEY + ".store", state.store);
      localStorage.setItem(KEY + ".mode", state.mode);
      localStorage.setItem(KEY + ".day", state.day);
      localStorage.setItem(KEY + ".logs", JSON.stringify(state.logs));
      localStorage.setItem(KEY + ".reviews", JSON.stringify(state.reviews));
    };
    const inScope = (s) => {
      if (state.region && s.region !== state.region) return false;
      if (state.store && s.id !== state.store) return false;
      if (state.manager) {
        const mgr = window.PULSE_ORG.managers.find((m) => m.id === state.manager);
        if (mgr && !mgr.stores.includes(s.id)) return false;
      }
      return state.scope === "company" || (state.scope.startsWith("region:") && s.region === state.scope.slice(7)) || (state.scope.startsWith("market:") && s.market === state.scope.slice(7));
    };
    const scopeLabel = () => state.scope === "company" ? "Company" : state.scope.split(":")[1];
    const money = (n) => {
      if (n == null) return "—";
      const sign = n < 0 ? "−" : n > 0 ? "+" : "";
      const a = Math.abs(n);
      return a >= 1000 ? sign + "$" + (a / 1000).toFixed(1) + "k" : sign + "$" + Math.round(a);
    };
    const pct = (n) => (n < 0 ? "−" : "+") + Math.abs(n).toFixed(0) + "%";
    function easterWeek(asOf) {
      return ["2029-04-01", "2029-04-08", "2029-04-15"].includes(asOf);
    }
    function easterBanner(asOf) {
      if (!easterWeek(asOf)) return "";
      const shifted = asOf === "2029-04-01" ? "Easter week" : asOf === "2029-04-08" ? "the week after Easter" : "the week the file would have called Easter";
      return `<p class="note easter">YoY shifted 14 days for Easter. Easter 2029 was Apr 1. Easter 2028 was Apr 16. The file’s comparable is 364 days back, so this week is ${shifted}. Page 2 reads it against the same days relative to Easter, not the calendar date.</p>`;
    }
    function easterRead(s) {
      if (!easterWeek(D.as_of)) return "";
      const sunday = s.days.find((d) => d.date === "2029-04-01");
      if (sunday) {
        const hole = sunday.net - sunday.exp;
        const rest = s.adj_gap - hole;
        return `<p class="note">Easter Sunday was ${money(sunday.net)} against a ${money(sunday.exp)} Sunday habit, ${money(hole)}. Take that holiday Sunday out and the week is ${money(rest)} after weather. Last year this Sunday was Apr 16, not the file’s Apr 2.</p>`;
      }
      return `<p class="note">Calendar YoY would use the week of ${D.as_of === "2029-04-15" ? "Apr 16, 2028, which was Easter" : "Apr 9, 2028, still before Easter"}. The shifted comparable is 14 days later, so this week is not scored as if it were Easter week last year.</p>`;
    }
    const allDays = [...new Set(weeks.flatMap((w) => w.stores[0].days.map((d) => d.date)))].sort();
    if (!allDays.includes(state.day)) state.day = allDays[allDays.length - 1];
    function weekFor(date) {
      return weeks.find((w) => w.stores.some((s) => s.days.some((d) => d.date === date))) || weeks[weeks.length - 1];
    }
    if (state.mode === "day") D = weekFor(state.day);
    function dayOf(s) {
      return s.days.find((d) => d.date === state.day) || s.days[s.days.length - 1];
    }
    function daySnap(s) {
      const d = dayOf(s);
      const gap = d.net - d.exp;
      const pacePct = d.exp ? gap / d.exp * 100 : 0;
      const spg = d.traf ? d.net / d.traf : 0;
      const spgPace = d.exp_traf ? d.exp / d.exp_traf : 0;
      const ticket = d.tix ? d.net / d.tix : 0;
      const ticketPace = d.exp_tix ? d.exp / d.exp_tix : 0;
      const sph = d.hours ? d.net / d.hours : 0;
      const sphPace = d.exp_hours ? d.exp / d.exp_hours : 0;
      const close = d.traf ? d.tix / d.traf * 100 : 0;
      const closePace = d.exp_traf ? d.exp_tix / d.exp_traf * 100 : 0;
      const trafPct = d.exp_traf ? (d.traf - d.exp_traf) / d.exp_traf * 100 : 0;
      return { d, gap, pacePct, spg, spgPace, ticket, ticketPace, sph, sphPace, close, closePace, trafPct };
    }
    function dayLabel(date) {
      return new Date(date + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", year: "numeric" });
    }
    function weekLabel(w) {
      const end = new Date(w.as_of + "T12:00:00");
      const start = new Date(end);
      start.setDate(end.getDate() - 6);
      const year = end.getFullYear();
      const left = start.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      if (start.getMonth() === end.getMonth()) return left + " – " + end.getDate() + ", " + year;
      const right = end.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      return left + " – " + right + ", " + year;
    }
    function setWeek(asOf) {
      const next = weeks.find((w) => w.as_of === asOf);
      if (!next) return;
      localStorage.setItem("pulse2.z.v1.week", asOf);
      D = next;
      byId = Object.fromEntries(D.stores.map((s) => [s.id, s]));
      render();
    }

    function rateFor(driver) {
      const stat = D.learning.by_driver.find((d) => d.driver === driver) || { n: 0, recovered: 0, rate: null };
      const extra = Object.values(state.reviews).filter((r) => r.driver === driver);
      const n = stat.n + extra.length;
      const recovered = stat.recovered + extra.filter((r) => r.recovered).length;
      return { n, recovered, rate: n ? recovered / n : null, base: stat };
    }

    function weekSvg(s) {
      const max = Math.max(...s.days.map((d) => Math.max(Math.abs(d.net), d.exp)), 1);
      return `<svg viewBox="0 0 280 46" width="100%" height="46" aria-label="Seven days against own pace">
        ${s.days.map((d, i) => {
          const x = i * 40;
          const eh = Math.max(2, d.exp / max * 32);
          const ah = Math.max(2, Math.abs(d.net) / max * 32);
          const beat = d.net >= d.exp * 0.97;
          return `<g data-tip="${d.wd}: ${money(d.net)} versus ${money(d.exp)} own pace">
                  <rect x="${x + 6}" y="${36 - eh}" width="8" height="${eh}" rx="1.5" fill="#e4d8c8"/>
                  <rect x="${x + 18}" y="${d.net < 0 ? 36 : 36 - ah}" width="8" height="${ah}" rx="1.5" fill="${beat ? "#1d5c40" : "#8d3419"}"/>
                  <text x="${x + 16}" y="45" font-size="8" fill="#8d847a" text-anchor="middle">${d.wd[0]}</text></g>`;
        }).join("")}
      </svg>`;
    }

    function dotPlot(rows) {
      const min = -70, max = 50;
      const x = (p) => 16 + (Math.max(min, Math.min(max, p)) - min) / (max - min) * 300;
      const dots = rows.map((r) => {
        const color = r.pct <= -30 ? "#8d3419" : r.pct < 0 ? "#8a5a16" : "#1d5c40";
        return `<circle cx="${x(r.pct)}" cy="28" r="${r.pct <= -30 ? 7 : 5}" fill="${color}" data-tip="${r.s.name}: ${pct(r.pct)} and ${money(r.gap)}"></circle>`;
      }).join("");
      return `<svg viewBox="0 0 332 52" role="img" aria-label="Every store on the percent off pace scale">
        <line x1="16" y1="28" x2="316" y2="28" stroke="#cfc4b4"/>
        <line x1="${x(-30)}" y1="16" x2="${x(-30)}" y2="40" stroke="#8d3419" stroke-dasharray="2 2"/>
        <line x1="${x(0)}" y1="18" x2="${x(0)}" y2="38" stroke="#8d847a"/>
        ${dots}
        <text x="16" y="50" font-size="9" fill="#8d847a">−70%</text>
        <text x="150" y="50" font-size="9" fill="#8d847a">0</text>
        <text x="292" y="50" font-size="9" fill="#8d847a">+50%</text>
      </svg>`;
    }

    function render() {
      const scoped = D.stores.filter(inScope);
      const dayMode = state.mode !== "week";
      const idx = dayMode ? allDays.indexOf(state.day) : weeks.findIndex((w) => w.as_of === D.as_of);
      const rows = scoped.map((s) => {
        const w = worstShift(s);
        const note = `<span class="hot">${w.label} ${pct(w.pct)}</span>`;
        if (!dayMode) return { s, pct: s.adj_pct, gap: s.adj_gap, note };
        const v = daySnap(s);
        return { s, pct: v.pacePct, gap: v.gap, note };
      }).sort((a, b) => a.pct - b.pct);
      const calls = rows.filter((r) => r.pct <= -30);
      const companyNet = dayMode ? scoped.reduce((n, s) => n + dayOf(s).net, 0) : D.company_week.net;
      const companyPace = dayMode ? scoped.reduce((n, s) => n + dayOf(s).exp, 0) : null;
      const companyPct = dayMode && companyPace ? (companyNet - companyPace) / companyPace * 100 : D.company_week.peer_median;
      const rest = rows.filter((r) => r.pct > -30);
      const row = (r, tight) => `<button class="slim${r.pct >= 0 ? " ok" : ""}" data-open="${r.s.id}"><span><b>${r.s.name}</b><span>${tight ? r.note : r.s.climate + " · " + r.note} · ${pct(r.pct)}</span></span><em>${money(r.gap)}</em></button>`;
      document.getElementById("app").innerHTML = `
        <header class="top">
          <div class="mark"><b>PULSE</b><span>Page 2</span></div>
          <div class="fresh"><div class="pill"><i></i> ${D.freshness}</div><small>${dayMode ? "Same weekday" : D.as_of_label}</small></div>
        </header>
        <p class="navline"><a href="log.html">Action log</a><a href="actions.html">Did it hold</a><a href="notes.html">Definitions</a></p>
        <div class="mode"><button id="mode-day" class="${dayMode ? "on" : ""}">Day</button><button id="mode-week" class="${dayMode ? "" : "on"}">Week</button></div>
        <div class="weekbar">
          <button id="step-prev" aria-label="Previous" ${idx === 0 ? "disabled" : ""}>‹</button>
          <div class="weeknow"><b>${dayMode ? dayLabel(state.day) : weekLabel(D)}</b></div>
          <button id="step-next" aria-label="Next" ${idx === (dayMode ? allDays.length : weeks.length) - 1 ? "disabled" : ""}>›</button>
        </div>
        ${dayMode ? "" : easterBanner(D.as_of)}
        <div class="filters">
          <select id="region-filter" aria-label="Region">${["", "North", "Central", "South"].map((r) => `<option value="${r}"${state.region === r ? " selected" : ""}>${r || "All regions"}</option>`).join("")}</select>
          <select id="mm-filter" aria-label="Market manager"><option value="">All market managers</option>${window.PULSE_ORG.managers.filter((m) => !state.region || m.region === state.region).map((m) => `<option value="${m.id}"${state.manager === m.id ? " selected" : ""}>${m.name} (${m.region})</option>`).join("")}</select>
        </div>
        <select id="store-filter" class="storefilter" aria-label="Store"><option value="">All stores</option>${D.stores.slice().sort((a, b) => a.name.localeCompare(b.name)).map((s) => `<option value="${s.id}"${state.store === s.id ? " selected" : ""}>${s.name}</option>`).join("")}</select>
        <section class="readout">
          <span class="note">${dayMode ? dayLabel(state.day) : weekLabel(D)}. Company ${pct(companyPct)} versus ${dayMode ? "the same weekday" : "its own pace"}.</span>
          <h1>Needs a call or a visit</h1>
          ${calls.length ? calls.map((r) => row(r, true)).join("") : `<p class="note">None in this filter.</p>`}
        </section>
        <div class="zrow">${dotPlot(rows)}</div>
        <p class="tipbox" id="plot-tip">Tap a dot for the store.</p>
        <div class="legend"><span><i class="sw" style="background:#8d3419"></i>30% or more off</span><span><i class="sw" style="background:#8a5a16"></i>Under</span><span><i class="sw" style="background:#1d5c40"></i>On pace</span></div>
        <h3 class="sec">The rest</h3>
        ${rest.map((r) => row(r, false)).join("")}
        ${learnBlock()}
        <p class="tie">${dayMode ? "Day" : "Week"} net <b>${companyNet.toLocaleString("en-US", { style: "currency", currency: "USD" })}</b>. Pace is the same weekday over the prior 8 weeks. <a class="textbtn" href="notes.html">Definitions</a></p>`;
      document.getElementById("mode-day").onclick = () => { state.mode = "day"; D = weekFor(state.day); byId = Object.fromEntries(D.stores.map((s) => [s.id, s])); save(); render(); };
      document.getElementById("mode-week").onclick = () => { state.mode = "week"; save(); render(); };
      document.getElementById("step-prev").onclick = () => dayMode ? idx > 0 && setDay(allDays[idx - 1]) : idx > 0 && setWeek(weeks[idx - 1].as_of);
      document.getElementById("step-next").onclick = () => dayMode ? idx < allDays.length - 1 && setDay(allDays[idx + 1]) : idx < weeks.length - 1 && setWeek(weeks[idx + 1].as_of);
      document.getElementById("region-filter").onchange = (e) => { state.region = e.target.value; if (state.manager && !window.PULSE_ORG.managers.find((m) => m.id === state.manager && (!state.region || m.region === state.region))) state.manager = ""; save(); render(); };
      document.getElementById("mm-filter").onchange = (e) => { state.manager = e.target.value; save(); render(); };
      document.getElementById("store-filter").onchange = (e) => { state.store = e.target.value; save(); render(); };
      document.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openSheet(evidence(b.dataset.open)));
      document.querySelectorAll("[data-tip]").forEach((el) => el.onclick = (e) => {
        e.stopPropagation();
        const box = document.getElementById("plot-tip");
        if (box) box.textContent = el.getAttribute("data-tip");
      });
      const m = document.getElementById("open-method");
      if (m) m.onclick = () => openSheet(methodSheet());
    }
    function setDay(date) {
      state.day = date;
      D = weekFor(date);
      byId = Object.fromEntries(D.stores.map((s) => [s.id, s]));
      save();
      render();
    }
    function card(s) {
      const log = state.logs[s.id];
      return `<button class="card" data-open="${s.id}">
        <div class="topr"><span class="z">${pct(s.adj_pct)}<small>vs own pace</small></span><span class="meta">${money(s.adj_gap)} after weather<br>${money(s.raw_gap)} before weather</span></div>
        <h2>${s.name}</h2>
        <div class="meta">${s.format} · ${s.market} · ${s.climate}</div>
        <p class="title">${positive(s).title}</p>
        ${weekSvg(s)}
        ${metricCards(s)}
        ${log ? `<p class="note">Logged · ${log.how || "call"} · ${log.who || log.role || "entered"}</p>` : ""}
        <p class="note">${positive(s).say}</p>
      </button>`;
    }
    function productFlags(s) {
      const week = (window.PULSE_PRODUCTS || {})[D.as_of] || {};
      return ((week[s.id] || {}).flags || []).filter((f) => f.pts <= -15 || (f.kind === "sku" && f.pts >= 15));
    }
    function productNote(s) {
      const flags = productFlags(s);
      if (!flags.length) return "";
      return flags.map((f) => f.kind === "sku"
        ? `${f.label} is ${f.share}% of the written file this week, versus a ${f.habit}% habit. One product is carrying the week.`
        : `${f.label} is ${f.share}% of the written file this week, versus a ${f.habit}% habit (${f.pts} pts).`).join(" ");
    }
    function shortMetric(label) {
      return { "Sales per guest": "SPG", "Average ticket": "Ticket", "Sales per hour": "SPH" }[label] || label;
    }
    function metricTip(m) {
      return shortMetric(m.label) + " $" + Math.round(m.actual) + " versus $" + Math.round(m.pace) + " own pace, " + pct(m.pct) + ". Flagged at 15% under.";
    }
    function metricCards(s) {
      const dayMode = state.mode !== "week";
      const v = dayMode ? daySnap(s) : null;
      const ticket = dayMode ? { actual: v.ticket, pace: v.ticketPace, pct: v.ticketPace ? (v.ticket - v.ticketPace) / v.ticketPace * 100 : 0 } : ((s.metrics || []).find((x) => x.label === "Average ticket") || { actual: 0, pace: 0, pct: 0 });
      const spg = dayMode ? { actual: v.spg, pace: v.spgPace, pct: v.spgPace ? (v.spg - v.spgPace) / v.spgPace * 100 : 0 } : ((s.metrics || []).find((x) => x.label === "Sales per guest") || { actual: 0, pace: 0, pct: 0 });
      const sph = dayMode ? { actual: v.sph, pace: v.sphPace, pct: v.sphPace ? (v.sph - v.sphPace) / v.sphPace * 100 : 0 } : ((s.metrics || []).find((x) => x.label === "Sales per hour") || { actual: 0, pace: 0, pct: 0 });
      const trafPct = dayMode ? v.trafPct : (s.expected.traf ? (s.actual.traf - s.expected.traf) / s.expected.traf * 100 : 0);
      const trafAct = dayMode ? v.d.traf : s.actual.traf;
      const trafPace = dayMode ? v.d.exp_traf : s.expected.traf;
      const close = dayMode ? v.close : s.rates.close;
      const closePace = dayMode ? v.closePace : s.base_rates.close;
      const closePts = close != null && closePace != null ? close - closePace : 0;
      const wx = dayMode ? v.d.wx : s.wx;
      const ly = dayMode ? v.d.ly : { high: s.wx.ly_high, inches: s.wx.ly_inches };
      const tempGap = wx.high - (ly.high || 0);
      const inches = wx.inches;
      const lyIn = ly.inches == null ? s.wx.ly_inches : ly.inches;
      const tone = (n) => n <= -15 ? "bad" : n >= 5 ? "good" : "";
      const cards = [
        ["SPG", pct(spg.pct), `$${Math.round(spg.actual)} vs $${Math.round(spg.pace)} pace`, tone(spg.pct), "SPG $" + Math.round(spg.actual) + " versus $" + Math.round(spg.pace) + " pace, " + pct(spg.pct)],
        ["SPH", pct(sph.pct), `$${Math.round(sph.actual)} vs $${Math.round(sph.pace)} pace`, tone(sph.pct), "SPH $" + Math.round(sph.actual) + " versus $" + Math.round(sph.pace) + " pace, " + pct(sph.pct)],
        ["Ticket", pct(ticket.pct), `$${Math.round(ticket.actual)} vs $${Math.round(ticket.pace)} pace`, tone(ticket.pct), "Average ticket $" + Math.round(ticket.actual) + " versus $" + Math.round(ticket.pace) + " pace, " + pct(ticket.pct)],
        ["Traffic", pct(trafPct), `${Math.round(trafAct)} vs ${Math.round(trafPace)} pace`, tone(trafPct), "Traffic " + Math.round(trafAct) + " versus " + Math.round(trafPace) + " pace, " + pct(trafPct)],
        ["Close", close == null ? "—" : close.toFixed(0) + "%", `${closePts >= 0 ? "+" : "−"}${Math.abs(closePts).toFixed(1)} pts vs ${closePace == null ? "—" : closePace.toFixed(0)}% habit`, closePts <= -3 ? "bad" : closePts >= 2 ? "good" : "", "Close rate versus habit."],
        ["Weather", wx.high + "°", `${tempGap >= 0 ? "+" : "−"}${Math.abs(tempGap).toFixed(0)}° vs last year · ${inches} in vs ${lyIn} in`, inches > lyIn + 0.4 ? "bad" : "", "High " + wx.high + "° versus " + ly.high + "° last year."]
      ];
      return `<div class="mcards">${cards.map(([name, big, sub, tone, title]) => `<div class="mcard ${tone}" data-tip="${tip(title)}"><b>${name} ${big}</b><span>${sub}</span></div>`).join("")}</div>`;
    }
    function worstShift(s) {
      const dayMode = state.mode !== "week";
      const v = dayMode ? daySnap(s) : null;
      const shifts = dayMode ? [
        ["SPG", v.spgPace ? (v.spg - v.spgPace) / v.spgPace * 100 : 0],
        ["SPH", v.sphPace ? (v.sph - v.sphPace) / v.sphPace * 100 : 0],
        ["Ticket", v.ticketPace ? (v.ticket - v.ticketPace) / v.ticketPace * 100 : 0],
        ["Traffic", v.trafPct],
        ["Close", v.close - v.closePace]
      ] : [
        ["SPG", ((s.metrics || []).find((m) => m.label === "Sales per guest") || {}).pct || 0],
        ["SPH", ((s.metrics || []).find((m) => m.label === "Sales per hour") || {}).pct || 0],
        ["Ticket", ((s.metrics || []).find((m) => m.label === "Average ticket") || {}).pct || 0],
        ["Traffic", s.expected.traf ? (s.actual.traf - s.expected.traf) / s.expected.traf * 100 : 0],
        ["Close", (s.rates.close || 0) - (s.base_rates.close || 0)]
      ];
      shifts.sort((a, b) => a[1] - b[1]);
      return { label: shifts[0][0], pct: shifts[0][1] };
    }
    function coachBlurb(s) {
      const w = worstShift(s);
      const lines = {
        SPG: "Guests came. The ticket did not. One-up the next open, and do not buy it with a discount.",
        SPH: "The hours did not pay for themselves. Match posted hours to who actually worked.",
        Ticket: "The ticket shrank. Step the mattress, then the base, then the care plan.",
        Traffic: "The door slowed and the weather does not explain it. Check the circular and the road sign.",
        Close: "Traffic did not turn into tickets. Watch the first sit. No one works a guest alone."
      };
      return w.label + " is the worst shift, " + pct(w.pct) + ". " + lines[w.label];
    }
    function metricFlags(s) {
      return (s.metrics || []).filter((m) => m.pct <= -15);
    }
    function peopleOptions() {
      const leaders = window.PULSE_ORG.regions.map((r) => `<option value="${r.leader}">${r.leader} · Regional leader · ${r.id}</option>`);
      const managers = window.PULSE_ORG.managers.map((m) => `<option value="${m.name}">${m.name} · Market manager · ${m.region}</option>`);
      return leaders.concat(managers).join("");
    }
    function roleFor(name) {
      const leader = window.PULSE_ORG.regions.find((r) => r.leader === name);
      if (leader) return "Regional leader";
      const mgr = window.PULSE_ORG.managers.find((m) => m.name === name);
      return mgr ? "Market manager" : "";
    }
    function metricChips(s) {
      return (s.metrics || []).filter((m) => m.pct <= -15).map((m) => `<span class="chip" title="${tip(metricTip(m))}">${shortMetric(m.label)} ${pct(m.pct)}</span>`).join("");
    }
    function tip(text) {
      return String(text).replace(/"/g, "");
    }
    function paceChart(s, spec) {
      const days = s.days.map((d) => {
        const act = spec.act(d);
        const exp = spec.exp(d);
        const gap = exp ? (act - exp) / exp * 100 : 0;
        return { wd: d.wd, act, exp, gap };
      });
      const max = Math.max(1, ...days.map((d) => Math.max(d.act, d.exp)));
      const bars = days.map((d, i) => {
        const x = i * 40;
        const eh = Math.max(2, d.exp / max * 46);
        const ah = Math.max(2, d.act / max * 46);
        const label = spec.money
          ? `${d.wd}: ${money(d.act)} versus ${money(d.exp)} own pace, ${pct(d.gap)}`
          : `${d.wd}: $${Math.round(d.act)} versus $${Math.round(d.exp)} own pace, ${pct(d.gap)}`;
        return `<g data-tip="${tip(label)}">
                <rect x="${x + 4}" y="${58 - eh}" width="10" height="${eh}" rx="1.5" fill="#e4d8c8"/>
                <rect x="${x + 16}" y="${58 - ah}" width="10" height="${ah}" rx="1.5" fill="${d.gap < -15 ? "#8d3419" : "#1d5c40"}"/>
                <text x="${x + 15}" y="72" font-size="8" fill="#8d847a" text-anchor="middle">${d.wd[0]}</text>
                <text x="${x + 15}" y="82" font-size="8" fill="${d.gap < -15 ? "#8d3419" : "#6d645b"}" text-anchor="middle">${pct(d.gap)}</text></g>`;
      }).join("");
      return `<p class="note" style="margin:12px 0 4px"><b>${spec.label}</b> · ${spec.week}</p>
        <svg viewBox="0 0 280 86" width="100%" height="86" role="img" aria-label="${tip(spec.label + " by day versus own pace")}">
          ${bars}
        </svg>`;
    }
    function metricCharts(s) {
      const flagged = new Set(metricFlags(s).map((m) => m.label));
      const specs = [
        { label: "Net sales", week: `${money(s.adj_gap)} after weather`, money: true, act: (d) => d.net, exp: (d) => d.exp, show: true },
        { label: "SPG", week: weekMetric(s, "Sales per guest"), act: (d) => d.traf ? d.net / d.traf : 0, exp: (d) => d.exp_traf ? d.exp / d.exp_traf : 0, show: true },
        { label: "Average ticket", week: weekMetric(s, "Average ticket"), act: (d) => d.tix ? d.net / d.tix : 0, exp: (d) => d.exp_tix ? d.exp / d.exp_tix : 0, show: flagged.has("Average ticket") },
        { label: "SPH", week: weekMetric(s, "Sales per hour"), act: (d) => d.hours ? d.net / d.hours : 0, exp: (d) => d.exp_hours ? d.exp / d.exp_hours : 0, show: true },
      ];
      return specs.filter((sp) => sp.show).map((sp) => paceChart(s, sp)).join("");
    }
    function weekMetric(s, label) {
      const m = (s.metrics || []).find((x) => x.label === label);
      if (!m) return "";
      return `$${Math.round(m.actual)} versus $${Math.round(m.pace)} pace, ${pct(m.pct)}`;
    }
    function slim(s) {
      const ahead = s.adj_pct >= 0;
      const extra = metricFlags(s).map((m) => shortMetric(m.label) + " " + pct(m.pct)).join(" · ");
      const good = positive(s);
      return `<button class="slim${ahead ? " ok" : ""}" data-open="${s.id}"><span><b>${s.name}</b><span>${s.climate} · ${good.title} · ${pct(s.adj_pct)}${extra ? " · " + extra : ""}</span></span><em>${money(s.adj_gap)}</em></button>`;
    }

    function learnBlock() {
      const rows = D.learning.by_driver.map((d) => {
        const r = rateFor(d.driver);
        return `<div class="barline"><span>${d.driver}</span><div class="track"><b style="width:${(r.rate || 0) * 100}%"></b></div><span>${r.recovered}/${r.n}</span></div>`;
      }).join("");
      const reviewed = Object.keys(state.reviews).length;
      return `<section class="learn">
        <h3 class="sec" style="margin-top:0">Did the coaching hold</h3>
        <p class="note">${D.learning.note}</p>
        ${rows}
        <p class="note">${reviewed ? reviewed + " review tags on this phone are in the rates above." : "Tag a past flag in a store sheet and the rate moves."}</p>
        <button class="textbtn" id="open-method">How the flag is earned</button>
      </section>`;
    }

    function wxSvg(s) {
      const days = s.days;
      const max = Math.max(0.4, ...days.map((d) => Math.max(d.wx.inches, d.ly.inches)));
      return `<svg viewBox="0 0 280 64" width="100%" height="64" aria-label="Rain this week versus last year">
        ${days.map((d, i) => {
          const x = i * 40;
          const h1 = d.wx.inches / max * 36;
          const h2 = d.ly.inches / max * 36;
          return `<g data-tip="${d.wd}: ${d.wx.inches} in, high ${d.wx.high}° versus ${d.ly.inches} in and ${d.ly.high}° last year">
                  <rect x="${x + 6}" y="${40 - h1}" width="8" height="${Math.max(h1, 1)}" fill="#31556a"/>
                  <rect x="${x + 18}" y="${40 - h2}" width="8" height="${Math.max(h2, 1)}" fill="#c9dde6"/>
                  <text x="${x + 16}" y="54" font-size="8" fill="#8d847a" text-anchor="middle">${d.wd}</text></g>`;
        }).join("")}
        <text x="0" y="62" font-size="8" fill="#31556a">This week</text>
        <text x="70" y="62" font-size="8" fill="#8aa4b0">Last year</text>
      </svg>`;
    }

    function evidence(id) {
      const s = byId[id];
      const log = state.logs[id];
      const est = rateFor(s.driver);
      const past = D.learning.weeks.flatMap((w) => w.items.filter((it) => it.id === id).map((it) => ({ ...it, label: w.label })));
      const pastHtml = past.length ? past.map((it) => {
        const key = id + "|" + it.label;
        const tagged = state.reviews[key];
        return `<p class="note">${it.label}: ${it.adj_pct}% off pace, next week ${it.next_pct}% after weather, ${it.recovered ? "back on pace" : "still off"}. Rain ${it.wx_inches} in, next week ${it.next_wx} in.
          <button class="textbtn" data-review="${key}" data-driver="${s.driver}" data-rec="${it.recovered}">${tagged ? "Tagged" : "Tag this coaching"}</button></p>`;
      }).join("") : `<p class="note">No earlier flag for this store in the review window. The estimate uses other stores with the same driver.</p>`;
      return `
        <button class="close-x" data-close>Close</button>
        <h2>${s.name}</h2>
        <p class="meta">${s.zone} · ${s.climate}</p>
        ${metricCards(s)}
        <p class="note">${coachBlurb(s)}</p>
        ${state.mode === "week" ? weekSvg(s) + wxSvg(s) + metricCharts(s) : ""}
        <p class="tipbox" id="sheet-tip">Tap a bar or a card for the numbers.</p>
        <label>Entered by</label>
        <input id="who" list="who-list" placeholder="Search a manager" value="${log ? log.who : ""}" style="width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:8px;font:inherit" />
        <datalist id="who-list">${peopleOptions()}</datalist>
        <label>Role</label>
        <select id="role">
          <option ${log && log.role === "Market manager" ? "selected" : ""}>Market manager</option>
          <option ${log && log.role === "Regional leader" ? "selected" : ""}>Regional leader</option>
          <option ${log && log.role === "Executive" ? "selected" : ""}>Executive</option>
        </select>
        <label>How</label>
        <select id="how">
          <option ${!log || log.how === "Call" ? "selected" : ""}>Call</option>
          <option ${log && log.how === "Visit" ? "selected" : ""}>Visit</option>
        </select>
        <label>Corrective action</label>
        <select id="act"><option>Visit the floor — walk the ups, the desk, and the sleep gallery</option><option>Call the manager before open</option>${s.try.map((t) => `<option>${t}</option>`).join("")}<option>Other — note below</option></select>
        <label>Note for the file</label>
        <textarea id="note" rows="2" placeholder="What you told the manager">${log ? log.note : ""}</textarea>
        <div class="acts">
          <button class="primary" id="save-log" data-id="${id}">${log ? "Update log" : "Log action"}</button>
        </div>
        ${log ? `<p class="note">Logged ${log.at.slice(0, 10)} by ${log.who || "unknown"}, ${log.role || "role not set"}: ${log.action}</p>` : ""}`;
    }

    function scopeSheet() {
      const regions = D.regions.map((r) => `
        <button data-scope="region:${r.name}" class="${state.scope === "region:" + r.name ? "on" : ""}"><span>${r.name}</span><span>${r.zone}</span></button>
        ${r.markets.map((m) => `<button data-scope="market:${m.name}" class="${state.scope === "market:" + m.name ? "on" : ""}"><span>${m.name}</span><span>${m.climate}</span></button>`).join("")}
      `).join("");
      return `<button class="close-x" data-close>Close</button><h2>Scope</h2><p class="note">North is the Northeast. Central is the central East Coast. South is Florida, Georgia, Alabama. Weather is simulated for that climate.</p><div class="scopes"><button data-scope="company" class="${state.scope === "company" ? "on" : ""}"><span>Company</span><span>23</span></button>${regions}</div>`;
    }
    function methodSheet() {
      return `<button class="close-x" data-close>Close</button><h2>How a flag is earned</h2><p>${D.method}</p><p>Own pace is the same weekday over the prior 8 weeks. Weather then moves that pace. Sales per guest, average ticket, and sales per hour are pushed to the manager when they are 15% or more under that habit. Those three are not excused by rain. A visit counts the same as a call.</p><p>The screen shows the dollar hole and the percent off pace. Hover a bar for the day.</p><p><button class="textbtn" id="reset">Reset this phone</button></p>`;
    }

    function openSheet(html) {
      const sheet = document.getElementById("sheet");
      sheet.innerHTML = html;
      sheet.classList.add("open");
      document.getElementById("back").classList.add("open");
      sheet.querySelectorAll("[data-close]").forEach((b) => b.onclick = closeSheet);
      sheet.querySelectorAll("[data-tip]").forEach((el) => el.onclick = (e) => {
        e.stopPropagation();
        const box = document.getElementById("sheet-tip");
        if (box) box.textContent = el.getAttribute("data-tip");
      });
      sheet.querySelectorAll("[data-scope]").forEach((b) => b.onclick = () => { state.scope = b.dataset.scope; save(); closeSheet(); render(); });
      sheet.querySelectorAll("[data-review]").forEach((b) => b.onclick = () => {
        state.reviews[b.dataset.review] = { driver: b.dataset.driver, recovered: b.dataset.rec === "true" };
        save(); openSheet(evidence(b.dataset.review.split("|")[0]));
      });
      const saveBtn = document.getElementById("save-log");
      if (saveBtn) saveBtn.onclick = () => {
        const id = saveBtn.dataset.id;
        const who = document.getElementById("who").value.trim();
        if (!who) { document.getElementById("who").focus(); return; }
        state.logs[id] = {
          action: document.getElementById("act").value,
          note: document.getElementById("note").value,
          who,
          role: roleFor(who) || document.getElementById("role").value,
          how: document.getElementById("how").value,
          at: new Date().toISOString(),
          driver: byId[id].driver,
          span: state.mode === "week" ? "week" : "day",
          when: state.mode === "week" ? D.as_of : state.day,
          before: state.mode === "week" ? byId[id].adj_pct : daySnap(byId[id]).pacePct
        };
        const hist = JSON.parse(localStorage.getItem(KEY + ".actions") || "[]");
        hist.push(Object.assign({ id }, state.logs[id]));
        localStorage.setItem(KEY + ".actions", JSON.stringify(hist));
        save(); closeSheet(); render();
      };
      const reset = document.getElementById("reset");
      if (reset) reset.onclick = () => { state.logs = {}; state.reviews = {}; save(); closeSheet(); render(); };
    }
    function closeSheet() {
      document.getElementById("sheet").classList.remove("open");
      document.getElementById("back").classList.remove("open");
    }
    document.getElementById("back").onclick = closeSheet;
    render();
    const openId = (location.hash || "").replace("#", "").replace("-log", "");
    if (byId[openId]) {
      openSheet(evidence(openId));
      if (location.hash.endsWith("-log")) {
        setTimeout(() => {
          const sheet = document.getElementById("sheet");
          const act = document.getElementById("who");
          if (sheet && act) sheet.scrollTop = act.offsetTop - 24;
        }, 50);
      }
    }
  </script>
</body>
</html>
